name: CI
run-name: robotjs_jm from ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build
        required: true
        default: master
        type: string

concurrency:
  group: robotjs-jm-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve source and publication eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish_npm: ${{ steps.metadata.outputs.publish_npm }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
    - name: Checkout requested source
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
        fetch-depth: 0
    - name: Resolve source and tag gate
      id: metadata
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        VERSION="$(node -p 'require("./package.json").version')"
        SOURCE_SHA="$(git rev-parse HEAD)"
        PUBLISH_NPM=false

        if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
          TAG_NAME=""
          if [[ "$REQUESTED_REF" == refs/tags/* ]]; then
            TAG_NAME="${REQUESTED_REF#refs/tags/}"
          elif git show-ref --verify --quiet "refs/tags/${REQUESTED_REF}"; then
            TAG_NAME="$REQUESTED_REF"
          fi

          if [[ -n "$TAG_NAME" ]]; then
            TAG_SHA="$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")"
            if [[ "$TAG_SHA" != "$SOURCE_SHA" ]]; then
              echo "Requested ref resolved to ${SOURCE_SHA}, but tag ${TAG_NAME} points to ${TAG_SHA}." >&2
              exit 1
            fi
            if [[ "$TAG_NAME" != "v${VERSION}" ]]; then
              echo "Tag/version mismatch: expected v${VERSION}, got ${TAG_NAME}." >&2
              exit 1
            fi
            PACKAGE_NAME="$(node -p 'require("./package.json").name')"
            npm view "$PACKAGE_NAME" versions --json --registry=https://registry.npmjs.org \
              | node .github/scripts/assert-version-newer.cjs "$VERSION"
            PUBLISH_NPM=true
          fi
        fi

        {
          echo "publish_npm=${PUBLISH_NPM}"
          echo "source_sha=${SOURCE_SHA}"
          echo "version=${VERSION}"
        } >> "$GITHUB_OUTPUT"

        if [[ "$PUBLISH_NPM" == true ]]; then
          echo "Tag v${VERSION} matches package version ${VERSION}; this run will publish to npm."
        else
          echo "Source ${REQUESTED_REF} is not an exact version tag; this run will retain build artifacts only."
        fi

  build:
    name: Build ${{ matrix.build-group }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            build-group: linux-x64
          - os: ubuntu-22.04-arm
            arch: arm64
            build-group: linux-arm64
          - os: macos-latest
            arch: x64
            build-group: darwin-universal
          - os: windows-latest
            arch: x86
            build-group: win32-x86
          - os: windows-latest
            arch: x64
            build-group: win32-x64
          - os: windows-11-arm
            arch: arm64
            build-group: win32-arm64
    env:
      BUILD_GROUP: ${{ matrix.build-group }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.metadata.outputs.source_sha }}
    - uses: actions/setup-node@v6
      with:
        node-version: '20'
        architecture: ${{ matrix.arch }}
    - name: Install linux dependencies
      if: ${{ (matrix.build-group == 'linux-x64') || (matrix.build-group == 'linux-arm64') }}
      run: sudo apt-get install libxtst-dev libpng++-dev
    - run: npm ci
    - name: Test helper protocol framing
      run: npm run test:protocol
    - name: Prebuildify
      run: npm run prebuild-$BUILD_GROUP
      shell: bash
    - uses: actions/upload-artifact@v6
      with:
        name: prebuilds-${{ matrix.build-group }}
        path: prebuilds/
        if-no-files-found: error
  publish:
    name: Publish to npm
    if: needs.metadata.outputs.publish_npm == 'true'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - metadata
      - build
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.metadata.outputs.source_sha }}
    - uses: actions/download-artifact@v7
      with:
        pattern: prebuilds-*
        path: prebuilds
        merge-multiple: true
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'
    - run: npm publish --provenance --access public
